# ansible all -m git_url -a' url=https://get.jenkins.io/war/2.422/jenkins.war dest=/home/ubuntu' -b
---
- name: Download Jenkins War file
  hosts: all
  become: yes
  tasks:
  - name: Download Jenkins war file to /home/ubuntu
    ansible.builtin.get_url:
      url: https://get.jenkins.io/war/2.422/jenkins.war
      dest: /home/ubuntu/jenkins.war
...